<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        background-color: #f5f5f5;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #333;
        color: white;
        padding: 16px;
      }

      header nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 250px;
        height: 100%;
        background-color: #444;
        padding-top: 60px;
        transition: 0.3s ease;
        z-index: 10;
      }

      header nav ul {
        display: flex;
        flex-direction: column;
        padding: 20px;
        gap: 15px;
      }

      header nav ul li {
        list-style: none;
      }

      header nav ul li a {
        color: inherit;
        text-decoration: none;
      }

      header div.logo {
        font-size: 20px;
        cursor: pointer;
        user-select: none;
      }

      header button.hamburger {
        font-size: 24px;
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        user-select: none;
      }

      header button.hamburger:hover {
        color: rgb(193, 193, 193);
      }

      /* MENGGUNAKAN SI DOM */
      header nav.active {
        right: 0;
      }

      /* Overlay */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: none;
      }

      .overlay.active {
        display: block;
      }

      @media (min-width: 768px) {
        header button.hamburger {
          display: none;
        }

        header nav {
          position: static;
          background: none;
          padding: 0;
          height: auto;
          width: auto;
        }

        header nav button {
          display: none;
        }

        header nav ul {
          flex-direction: row;
        }

        header nav ul li {
          padding: 0 10px;
        }

        .overlay {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">My App</div>
      <button class="hamburger" id="hamburger">☰</button>
      <nav id="menu" class="">
        <button id="keluarButton">keluar</button>
        <ul>
          <li><a href="">Home</a></li>
          <li><a href="">About</a></li>
          <li><a href="">Contact</a></li>
          <li><a href="">Address</a></li>
        </ul>
      </nav>
    </header>
    <div class="overlay" id="overlay"></div>
    <main>
      <h1>Welcome</h1>
      <p>click hamburger menu to open navigation</p>
    </main>

    <script>
      const hamburgerBtn = document.getElementById('hamburger');
      const navMenu = document.getElementById('menu');
      const overlay = document.getElementById('overlay');
      const keluarBtn = document.getElementById('keluarButton');

      hamburgerBtn.addEventListener('click', function () {
        navMenu.classList.toggle('active');
        overlay.classList.toggle('active');
      });

      overlay.addEventListener('click', () => {
        navMenu.classList.remove('active');
        overlay.classList.remove('active');
      });

      keluarBtn.addEventListener('click', () => {
        navMenu.classList.remove('active');
        overlay.classList.remove('active');
      });

      document.addEventListener('click', function (e) {
        const isClickInsideMenu = navMenu.contains(e.target);
        const isClickHamburgerButton = hamburgerBtn.contains(e.target);

        if (!isClickHamburgerButton && !isClickInsideMenu) {
          navMenu.classList.remove('active');
          overlay.classList.remove('active');
        }
      });
    </script>
  </body>
</html>
